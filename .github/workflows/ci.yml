name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  format-and-lint:
    name: Format and Lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: winding
      - name: Conda info
        shell: bash -el {0}
        run: conda info
      - name: Conda list
        shell: pwsh
        run: conda list
      - name: Format code with black
        shell: bash -el {0}
        run: |
          black . --check
      - name: Lint code with ruff
        shell: bash -el {0}
        run: |
          ruff check . --exit-zero

  test:
    name: Run Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: winding
      - name: Conda info
        shell: bash -el {0}
        run: conda info
      - name: Conda list
        shell: pwsh
        run: conda list
      - name: Run tests with pytest
        shell: bash -el {0}
        run: |
          pytest -v --tb=short --disable-warnings tests/

  simulation-export:
    name: Simulation Export (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: Linux
            output: simulation/bin/simulation.x86_64
            output_rel: bin/simulation.x86_64
            artifact: linux
          - os: windows-latest
            preset: Windows
            output: simulation/bin/simulation.exe
            output_rel: bin/simulation.exe
            artifact: windows
          - os: macos-latest
            preset: macOS
            output: simulation/bin/simulation.app
            output_rel: bin/simulation.app
            artifact: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      - name: Show configured export presets
        shell: bash
        run: |
          grep -E '^name="' simulation/export_presets.cfg || true

      - name: Export simulation
        shell: bash
        run: |
          mkdir -p simulation/bin
          cd simulation
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output_rel }}"

      - name: Verify export output exists
        shell: bash
        run: |
          test -e "${{ matrix.output }}"

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulation-${{ matrix.artifact }}
          path: ${{ matrix.output }}