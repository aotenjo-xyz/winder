name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  format-and-lint:
    name: Format and Lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: winding
      - name: Conda info
        shell: bash -el {0}
        run: conda info
      - name: Conda list
        shell: pwsh
        run: conda list
      - name: Format code with black
        shell: bash -el {0}
        run: |
          black . --check
      - name: Lint code with ruff
        shell: bash -el {0}
        run: |
          ruff check . --exit-zero

  test:
    name: Run Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: winding
      - name: Conda info
        shell: bash -el {0}
        run: conda info
      - name: Conda list
        shell: pwsh
        run: conda list
      - name: Run tests with pytest
        shell: bash -el {0}
        run: |
          pytest -v --tb=short --disable-warnings tests/

  tauri-build:
    name: Tauri Build Test (${{ matrix.os }})
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            allow_failure: false
          - os: windows-latest
            allow_failure: false
          - os: macos-latest
            allow_failure: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Rust dependencies for Tauri build
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install frontend dependencies
        shell: bash -el {0}
        working-directory: gui/frontend
        run: npm ci

      # Tauri validates every externalBin entry during compilation. The real
      # PyInstaller sidecar is built by tauri-release.yml; this compile-only
      # job needs only a correctly named placeholder.
      - name: Create placeholder backend sidecar
        shell: bash -el {0}
        working-directory: gui/frontend
        run: |
          target_triple="$(rustc --print host-tuple)"
          extension=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            extension=".exe"
          fi
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/winder-backend-${target_triple}${extension}"
          chmod +x "src-tauri/binaries/winder-backend-${target_triple}${extension}"

      - name: Test Tauri release build
        shell: bash -el {0}
        working-directory: gui/frontend
        run: |
          npm run tauri build -- --no-bundle
