[package]
name = "winder-gui"
version = "1.0.0-alpha.1"
description = "Desktop GUI for the Aotenjo winding machine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "winder-gui"
path = "src/main.rs"
