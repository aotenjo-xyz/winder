# Configuration file for winding machine
# production settings

serial:
  port: "/dev/ttyACM0"
  baudrate: 115200

logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL

motor:
  M0: 
    direction: false
    wind_range_end: -14.0
    wind_range_start: -25.5
    end_to_zero: 9.0
    velocity: 5.0
    vP: 0.2
    vI: 20.0
    vD: 0.001
    pP: 20.0
    voltage_limit: 6.0
    velocity_limit: 10.0
    lpfTf: 0.01

  M1:
    direction: true
    zero: -0.04
    end_to_rotating_position: 6.0
    velocity: 5.0
    vP: 0.2
    vI: 20.0
    vD: 0.001
    pP: 5.0
    voltage_limit: 6.0
    velocity_limit: 10.0
    lpfTf: 0.005

  M2:
    direction: true
    zero: 0.23
    angle_to_prevent_collision: 1.0
    velocity: 20.0
    vP: 0.2
    vI: 20.0
    vD: 0.001
    pP: 20.0
    voltage_limit: 24.0
    velocity_limit: 30.0
    lpfTf: 0.01

  M3:
    direction: false
    pull_wire_torque: 0.15
    wind_torque: 0.04
    velocity: 5.0

winding:
  # production
  turns: 75
  starts_at: 0
  winding_config: "AaAabBbBCcCcaAaABbBbcCcC" # 24n22p
  dont_move_m3: false # true for debugging, false for production