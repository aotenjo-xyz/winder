# Configuration file for winding machine
# simulation settings

serial:
  port: "/dev/ttyACM0"
  baudrate: 115200

logging:
  level: "INFO"
motor:
  M0: 
    direction: false
    wind_range_end: -14.0
    wind_range_start: -25.5
    end_to_zero: 9.0
    velocity: 10.0
  M1:
    direction: true
    zero: 0.0
    end_to_rotating_position: 6.0
    velocity: 1.0
  M2:
    direction: true
    zero: 0.0
    angle_to_prevent_collision: 1.0
    velocity: 20.0
  M3:
    direction: false
    pull_wire_torque: 0.15
    wind_torque: 0.04
    velocity: 5.0

winding:
  turns: 15
  starts_at: 0
  winding_config: "AaABbBCcCAaABbBCcCAaABbBCcCAaABbBCcC" # 36n40p
  dont_move_m3: false # true for debugging, false for production